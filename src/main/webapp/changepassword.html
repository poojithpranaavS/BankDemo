<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - State Bank of India</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">SBI</div>
                    <div class="logo-text">
                        <h1>State Bank of India</h1>
                        <p>India's Trusted Bank Since 1806</p>
                    </div>
                </div>
                <nav id="mainNav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="transfer.html">Transfer</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="profile.html">Profile</a>
                </nav>
                <form action="logout" method="post" style="margin:0;">
                    <button type="submit" class="btn-login">Logout</button>
                </form>
            </div>
        </div>
    </header>

    <div class="main-wrapper">
        <div class="container">
            <div class="transfer-form">
                <h3
                    style="font-family: 'Crimson Pro', serif; font-size: 1.75rem; margin-bottom: 1.5rem; color: var(--sbi-navy);">
                    Profile Settings</h3>
                <div id="profileAlert"></div>

                <form id="profileForm" action="changePassword" method="post">
                    <div class="form-group">
                        <label>Old Password</label>
                        <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                            required>
                    </div>
                   
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="width: 100%; text-align: center">Update Password</button>
                    </div>
                    <div style="margin-top: 1rem; text-align: center;">
                        <a href="dashboard.html" style="color: var(--sbi-teal); text-decoration: none;">← Back to
                            Dashboard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 State Bank of India. All rights reserved. | This is a demo website for educational
                    purposes.</p>
            </div>
        </div>
    </footer>

</body>

</html>
